name: Provision Student Repositories

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Template Repo (e.g. owner/repo)'
        required: false
      assignment_name:
        description: 'Assignment Name (e.g. hw1)'
        required: false
      students_json:
        description: 'JSON array of students to provision'
        required: false
      target_owner:
        description: 'Target GitHub Organization (optional)'
        required: false
      tracking_repo:
        description: 'Tracking Repository Name'
        required: false
        default: 'class-repo-tracking'
      add_codespaces:
        description: 'Add Codespaces button'
        required: false
      server_url:
        description: 'URL of the server'
        required: false
      shortcode:
        description: 'Assignment shortcode for KV'
        required: false
      dry_run:
        description: 'Run diagnostics instead of provisioning'
        required: false
        default: 'false'
      payload:
        description: 'JSON payload for advanced routing and inputs'
        required: false

jobs:
  provision:
    uses: class-repo/class-repo-automator/.github/workflows/core.yml@main
    with:
      template: ${{ github.event.inputs.template }}
      assignment_name: ${{ github.event.inputs.assignment_name }}
      students_json: ${{ github.event.inputs.students_json }}
      target_owner: ${{ github.event.inputs.target_owner }}
      tracking_repo: ${{ github.event.inputs.tracking_repo }}
      add_codespaces: ${{ github.event.inputs.add_codespaces }}
      server_url: ${{ github.event.inputs.server_url }}
      shortcode: ${{ github.event.inputs.shortcode }}
      dry_run: ${{ github.event.inputs.dry_run }}
      payload: ${{ github.event.inputs.payload }}
    secrets: inherit
