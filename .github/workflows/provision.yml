name: Provision Student Repository

on:
  repository_dispatch:
    types: [create_repo]

  workflow_dispatch:
    inputs:
      template:
        description: 'Template Repo (e.g. owner/repo)'
        required: true
      repo_name:
        description: 'New Repo Name (e.g. hw1-student)'
        required: true
      student_handle:
        description: 'Student GitHub Handle'
        required: true
      student_email:
        description: 'Student Email (optional)'
        required: false
      target_owner:
        description: 'Target GitHub Organization (optional)'
        required: false

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Executor App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLASSREPO_APP_ID }}
          private-key: ${{ secrets.CLASSREPO_APP_PRIVATE_KEY }}
          owner: ${{ github.event.inputs.target_owner || github.repository_owner }}

      - name: Create Repository from Template
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TEMPLATE: ${{ github.event.inputs.template || inputs.template }}
          REPO_NAME: ${{ github.event.inputs.repo_name || inputs.repo_name }}
          OWNER: ${{ github.event.inputs.target_owner || github.repository_owner }}
        run: |
          echo "Generating repository $REPO_NAME from template $TEMPLATE in $OWNER..."
          
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/$TEMPLATE/generate \
            -f owner="$OWNER" \
            -f name="$REPO_NAME" \
            -F private=true \
            -F include_all_branches=false

          echo "Waiting for repository creation to complete..."
          sleep 3

      - name: Invite Student to Repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STUDENT_HANDLE: ${{ github.event.inputs.student_handle || inputs.student_handle }}
          REPO_NAME: ${{ github.event.inputs.repo_name || inputs.repo_name }}
          OWNER: ${{ github.event.inputs.target_owner || github.repository_owner }}
        run: |
          echo "Inviting $STUDENT_HANDLE to $REPO_NAME in $OWNER..."
          
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/$OWNER/$REPO_NAME/collaborators/$STUDENT_HANDLE \
            -f permission="write"

      - name: Checkout Automator Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log Student Email Securely
        env:
          STUDENT_HANDLE: ${{ github.event.inputs.student_handle || inputs.student_handle }}
          STUDENT_EMAIL: ${{ github.event.inputs.student_email || inputs.student_email }}
          REPO_NAME: ${{ github.event.inputs.repo_name || inputs.repo_name }}
        run: |
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p logs
          echo "$STUDENT_HANDLE,$STUDENT_EMAIL,$REPO_NAME,$DATE" >> logs/created_repos.csv
          
          git config --global user.name "ClassRepo Automator"
          git config --global user.email "automator@classrepo.internal"
          git add logs/created_repos.csv
          git commit -m "Log repository creation for $STUDENT_HANDLE" || true
          git push || true
