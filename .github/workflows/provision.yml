# Provision Student Repositories
#
# Started by the ClassRepo server (workflow_dispatch). This repository may be public, so the dispatch
# carries only a random batch id. The job (template, assignment, and student records sealed to this
# repo's roster key) is fetched from the server using this run's GitHub OIDC token, and the logic in
# scripts/provision.js never logs anything identifying. See README.md.
name: Provision Student Repositories

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Random id of the job to run (set by the ClassRepo server)'
        required: true
      server_url:
        description: 'URL of the ClassRepo server'
        required: true

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # check out this repository
      id-token: write   # lets the run prove its identity to the ClassRepo server (OIDC)
    steps:
      - name: Generate Executor App Token
        id: app-token
        # v1.12.0, pinned to the exact commit so the action cannot change under you. Dependabot proposes updates.
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.CLASSREPO_APP_ID }}
          private-key: ${{ secrets.CLASSREPO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Bot Repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run job
        # v7.1.0
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          BATCH_ID: ${{ inputs.batch_id }}
          SERVER_URL: ${{ inputs.server_url }}
          EXECUTOR_TOKEN: ${{ steps.app-token.outputs.token }}
          ROSTER_PRIVATE_KEY: ${{ secrets.CLASSREPO_ROSTER_PRIVATE_KEY }}
          TRACKING_REPO: ${{ vars.CLASSREPO_TRACKER_NAME || 'class-repo-tracking' }}
          # Optional: comma-separated owners whose repositories may be used as templates.
          ALLOWED_TEMPLATE_OWNERS: ${{ vars.CLASSREPO_ALLOWED_TEMPLATE_OWNERS }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/provision.js`);
            await run({ github, context, core });
