name: Provision Student Repository

on:
  repository_dispatch:
    types: [create_repo]

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Executor App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLASSREPO_APP_ID }}
          private-key: ${{ secrets.CLASSREPO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create Repository from Template
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TEMPLATE: ${{ github.event.client_payload.template }}
          REPO_NAME: ${{ github.event.client_payload.repo_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "Generating repository $REPO_NAME from template $TEMPLATE..."
          
          # We use gh api to call the template generation endpoint
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/$OWNER/$TEMPLATE/generate \
            -f owner="$OWNER" \
            -f name="$REPO_NAME" \
            -F private=true \
            -F include_all_branches=false

          echo "Waiting for repository creation to complete..."
          sleep 3

      - name: Invite Student to Repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STUDENT_HANDLE: ${{ github.event.client_payload.student_handle }}
          REPO_NAME: ${{ github.event.client_payload.repo_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "Inviting $STUDENT_HANDLE to $REPO_NAME..."
          
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/$OWNER/$REPO_NAME/collaborators/$STUDENT_HANDLE \
            -f permission="write"

      - name: Checkout Automator Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log Student Email Securely
        env:
          STUDENT_HANDLE: ${{ github.event.client_payload.student_handle }}
          STUDENT_EMAIL: ${{ github.event.client_payload.student_email }}
          REPO_NAME: ${{ github.event.client_payload.repo_name }}
        run: |
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "$STUDENT_HANDLE,$STUDENT_EMAIL,$REPO_NAME,$DATE" >> logs/created_repos.csv
          
          git config --global user.name "ClassRepo Automator"
          git config --global user.email "automator@classrepo.internal"
          git add logs/created_repos.csv
          git commit -m "Log repository creation for $STUDENT_HANDLE"
          git push
